<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"
     role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">How receipts flow between the eight FTQC tools, level by level</title>
  <desc id="desc">Five levels from top to bottom: code (ftqc_codes), circuit (ftqc_faults),
    logical operation and decoding (ftqc_extractors, ftqc_gadgets, ftqc_decoders),
    composition (ftqc_compose) and resources (ftqc_magic, ftqc_uncompute).
    Codes supply constructions to faults, checks and logical bases to extractors and check
    matrices to decoders. Extractors export probe circuits to faults and receive the fault model.
    Faults supply fault propagation to gadgets, decoders supply decoder rules to gadgets, and
    gadgets supply surgery instruments to extractors. Gadgets and extractors pass receipts to
    compose, and magic passes factory contracts to compose. Compose supplies the schedule format
    and decoders the reaction latency to uncompute. Each consumer re-verifies the receipt it reads.</desc>
  <style>
    svg { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }
    .canvas { fill: #fff; }
    .band { fill: #f1f5f9; }
    .tier { font-size: 13px; fill: #475569; font-weight: bold; letter-spacing: 0.5px; }
    .edges { fill: none; stroke: #475569; stroke-width: 1.8; }
    .tip { fill: #475569; }
    .labels { font-size: 13px; fill: #334155; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; paint-order: stroke; }
    .note { font-size: 13px; fill: #475569; }
    .node rect { stroke-width: 2; rx: 7px; }
    .node text { fill: #172033; font-size: 13px; }
    .node .name { font-size: 18px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0d1117; }
      .band { fill: #161b22; }
      .tier, .note { fill: #aebac8; }
      .edges { stroke: #aebac8; }
      .tip { fill: #aebac8; }
      .labels { fill: #dae2ed; stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path class="tip" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path class="tip" d="M8 0 L0 4 L8 8 Z"/>
    </marker>
  </defs>
  <rect class="canvas" width="960" height="640"/>

  <!-- level bands -->
  <rect class="band" x="10" y="22" width="940" height="76" rx="6"/>
  <rect class="band" x="10" y="137" width="940" height="76" rx="6"/>
  <rect class="band" x="10" y="262" width="940" height="76" rx="6"/>
  <rect class="band" x="10" y="387" width="940" height="76" rx="6"/>
  <rect class="band" x="10" y="507" width="940" height="76" rx="6"/>
  <g class="tier">
    <text x="80" y="65">CODE</text>
    <text x="80" y="180">CIRCUIT</text>
    <text x="80" y="297">LOGICAL</text>
    <text x="80" y="313">OPERATION</text>
    <text x="80" y="430">COMPOSITION</text>
    <text x="80" y="550">RESOURCES</text>
  </g>

  <g class="edges" marker-end="url(#arrow)">
    <!-- codes -> faults -->
    <path d="M560 91 V143"/>
    <!-- codes -> extractors -->
    <path d="M450 70 C330 80 300 200 300 268"/>
    <!-- codes -> decoders -->
    <path d="M670 70 C790 80 820 200 820 268"/>
    <!-- faults -> gadgets -->
    <path d="M560 206 V268"/>
    <!-- decoders -> gadgets -->
    <path d="M710 300 H672"/>
    <!-- gadgets -> extractors -->
    <path d="M450 300 H412"/>
    <!-- gadgets -> compose -->
    <path d="M560 331 V393"/>
    <!-- extractors -> compose -->
    <path d="M300 331 C300 380 360 412 448 418"/>
    <!-- magic -> compose -->
    <path d="M300 514 C300 470 360 440 448 432"/>
    <!-- compose -> uncompute -->
    <path d="M672 432 C760 440 820 470 820 513"/>
    <!-- decoders -> uncompute -->
    <path d="M880 331 V513"/>
  </g>
  <!-- extractors <-> faults -->
  <path class="edges" marker-start="url(#arrow-start)" marker-end="url(#arrow)" d="M340 268 C340 220 390 180 448 176"/>

  <g class="labels">
    <text x="566" y="122" text-anchor="start">constructions, LRAT</text>
    <text x="345" y="118">checks, logical bases</text>
    <text x="806" y="150">check matrices</text>
    <text x="352" y="214">probes, fault model</text>
    <text x="566" y="242" text-anchor="start">fault propagation</text>
    <text x="566" y="366" text-anchor="start">receipts, fault cones</text>
    <text x="330" y="378">measurement receipts</text>
    <text x="330" y="480">factory contracts</text>
    <text x="770" y="480">schedule format</text>
    <text x="874" y="430" text-anchor="end">reaction latency</text>
  </g>
  <g class="note">
    <text x="691" y="256">decoder rules</text>
    <text x="431" y="256">surgery instruments</text>
    <text x="480" y="612">Each consumer re-verifies the receipt it reads. Premises that are not discharged travel with the result.</text>
  </g>

  <g class="node" transform="translate(560 60)">
    <rect x="-110" y="-31" width="220" height="62" fill="#CCFBF1" stroke="#0F766E"/>
    <text class="name" y="-4">ftqc_codes</text>
    <text y="17">code facts and actions</text>
  </g>
  <g class="node" transform="translate(560 175)">
    <rect x="-110" y="-31" width="220" height="62" fill="#FFE4D5" stroke="#C2410C"/>
    <text class="name" y="-4">ftqc_faults</text>
    <text y="17">circuit faults, ZX equivalence</text>
  </g>
  <g class="node" transform="translate(300 300)">
    <rect x="-110" y="-31" width="220" height="62" fill="#DBEAFE" stroke="#2563EB"/>
    <text class="name" y="-4">ftqc_extractors</text>
    <text y="17">logical measurements</text>
  </g>
  <g class="node" transform="translate(560 300)">
    <rect x="-110" y="-31" width="220" height="62" fill="#DCFCE7" stroke="#15803D"/>
    <text class="name" y="-4">ftqc_gadgets</text>
    <text y="17">gadgets on unknown inputs</text>
  </g>
  <g class="node" transform="translate(820 300)">
    <rect x="-110" y="-31" width="220" height="62" fill="#EDE9FE" stroke="#7C3AED"/>
    <text class="name" y="-4">ftqc_decoders</text>
    <text y="17">decoder certificates</text>
  </g>
  <g class="node" transform="translate(560 425)">
    <rect x="-110" y="-31" width="220" height="62" fill="#FEF3C7" stroke="#A16207"/>
    <text class="name" y="-4">ftqc_compose</text>
    <text y="17">joins and probability bounds</text>
  </g>
  <g class="node" transform="translate(300 545)">
    <rect x="-110" y="-31" width="220" height="62" fill="#E0F2FE" stroke="#0369A1"/>
    <text class="name" y="-4">ftqc_magic</text>
    <text y="17">magic-state factories</text>
  </g>
  <g class="node" transform="translate(820 545)">
    <rect x="-110" y="-31" width="220" height="62" fill="#FCE7F3" stroke="#BE185D"/>
    <text class="name" y="-4">ftqc_uncompute</text>
    <text y="17">logical cleanup</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
